<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>人工智能训练师培训资料</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="description" content="人工智能训练师（三级/四级/五级）教案、学员讲义、试题库与自学材料">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #2f6f4f;
    }
    .sidebar-nav li.has-children > a:not(:only-child)::before {
      content: '';
    }
    .markdown-section pre {
      overflow-x: auto;
    }
    .markdown-section table {
      display: table;
      width: 100%;
    }

    /* ---- 移动端导航栏与正文标题重叠修复 ----
       docsify vue.css 在 <=768px 时把 .content 的 padding-top 从 60px 砍到 20px，
       但 .app-nav 仍是 position:absolute 悬浮在 main 顶部；本站导航链接较多，
       窄屏下会换行到 2-3 行，换行后的高度超过 20px，就会压住文章 H1。
       这里把 .app-nav 改成随文档流正常排布（position:static），
       这样无论它换几行，.content 都会自然被推到它下方，不会重叠。 */
    @media screen and (max-width: 768px) {
      .github-corner {
        display: none;
      }
      .app-nav {
        position: static;
        margin: 12px 44px 0 16px;
        text-align: center;
      }
      .app-nav li {
        margin: 0 .5rem;
      }
      .content {
        padding-top: 10px;
      }
    }

    /* ---- 深色模式 ---- */
    html[data-theme="dark"] body,
    html[data-theme="dark"] .sidebar,
    html[data-theme="dark"] .content {
      background-color: #1b1e22;
    }
    html[data-theme="dark"] .sidebar {
      border-right-color: rgba(255, 255, 255, .08);
    }
    html[data-theme="dark"] .sidebar,
    html[data-theme="dark"] .sidebar > h1 a {
      color: #c9d1d9;
    }
    html[data-theme="dark"] .sidebar ul li a {
      color: #9aa5b1;
    }
    html[data-theme="dark"] .sidebar ul li a:hover,
    html[data-theme="dark"] .sidebar ul li.active > a {
      color: var(--theme-color);
    }
    html[data-theme="dark"] .app-sub-sidebar li::before {
      color: #6a7178;
    }
    html[data-theme="dark"] .app-nav a {
      color: #c9d1d9;
    }
    html[data-theme="dark"] .app-nav li ul {
      background-color: #262a2f;
      border-color: #3a3f45;
    }
    html[data-theme="dark"] .sidebar-toggle {
      background-color: rgba(27, 30, 34, .85);
    }
    html[data-theme="dark"] .sidebar-toggle span {
      background-color: var(--theme-color);
    }
    html[data-theme="dark"] .markdown-section {
      color: #c9d1d9;
    }
    html[data-theme="dark"] .markdown-section h1,
    html[data-theme="dark"] .markdown-section h2,
    html[data-theme="dark"] .markdown-section h3,
    html[data-theme="dark"] .markdown-section h4,
    html[data-theme="dark"] .markdown-section strong {
      color: #e6edf3;
    }
    html[data-theme="dark"] .markdown-section a {
      color: #5fd3a6;
    }
    html[data-theme="dark"] .markdown-section code,
    html[data-theme="dark"] .markdown-section pre {
      background-color: #11151a;
    }
    html[data-theme="dark"] .markdown-section code {
      color: #ffa959;
    }
    html[data-theme="dark"] .markdown-section pre > code {
      color: #c9d1d9;
    }
    html[data-theme="dark"] .markdown-section pre::after {
      color: #555;
    }
    html[data-theme="dark"] .token.punctuation {
      color: #9aa5b1;
    }
    html[data-theme="dark"] .markdown-section tr:nth-child(2n),
    html[data-theme="dark"] .markdown-section p.tip {
      background-color: #22262b;
    }
    html[data-theme="dark"] .markdown-section td,
    html[data-theme="dark"] .markdown-section th {
      border-color: #343a40;
    }
    html[data-theme="dark"] .markdown-section tr {
      border-top-color: #343a40;
    }
    html[data-theme="dark"] .markdown-section hr {
      border-bottom-color: #343a40;
    }
    html[data-theme="dark"] .markdown-section blockquote,
    html[data-theme="dark"] .markdown-section em {
      color: #8b949e;
    }
    html[data-theme="dark"] section.cover {
      background: #1b1e22 !important;
      color: #e6edf3;
    }
    html[data-theme="dark"] section.cover.has-mask .mask {
      background-color: #1b1e22;
      opacity: .85;
    }
    html[data-theme="dark"] section.cover h1,
    html[data-theme="dark"] section.cover blockquote {
      color: #e6edf3;
    }
    html[data-theme="dark"] .search input {
      background-color: #22262b;
      color: #c9d1d9;
    }
    html[data-theme="dark"] .search .matching-post {
      border-bottom-color: #343a40;
    }
    html[data-theme="dark"] .search {
      border-bottom-color: #343a40;
    }

    /* ---- 右下角悬浮按钮（深色模式切换 / 回到顶部） ---- */
    .float-btn {
      position: fixed;
      right: 18px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, .1);
      background: #fff;
      font-size: 18px;
      line-height: 40px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .18);
      z-index: 50;
      user-select: none;
      transition: opacity .2s, transform .2s;
    }
    #theme-toggle {
      bottom: 18px;
    }
    #back-to-top {
      bottom: 68px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
    }
    #back-to-top.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    html[data-theme="dark"] .float-btn {
      background: #262a2f;
      border-color: rgba(255, 255, 255, .15);
      color: #e6edf3;
    }
    @media screen and (max-width: 768px) {
      .float-btn {
        right: 12px;
        width: 38px;
        height: 38px;
        line-height: 36px;
        font-size: 16px;
      }
      #theme-toggle { bottom: 12px; }
      #back-to-top { bottom: 58px; }
    }
  </style>
</head>
<body>
  <div id="app">加载中...</div>
  <button id="theme-toggle" class="float-btn" title="切换深色/浅色模式" aria-label="切换深色/浅色模式">🌙</button>
  <button id="back-to-top" class="float-btn" title="回到顶部" aria-label="回到顶部">↑</button>

  <script>
    // 深色模式：尽早执行，避免切页时出现浅色闪烁
    (function () {
      var KEY = 'docsify-theme';
      function apply(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        var btn = document.getElementById('theme-toggle');
        if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
      }
      var saved = localStorage.getItem(KEY);
      var preferDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      apply(saved || (preferDark ? 'dark' : 'light'));

      document.getElementById('theme-toggle').addEventListener('click', function () {
        var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        localStorage.setItem(KEY, next);
        apply(next);
      });
    })();

    // 回到顶部按钮：滚动一段距离后显示；兼容桌面端 .content 和移动端 window 两种滚动容器
    (function () {
      var btn = document.getElementById('back-to-top');
      function scroller() {
        return document.querySelector('.content') || document.documentElement;
      }
      function onScroll() {
        var top = (document.querySelector('.content') || {}).scrollTop || window.scrollY || document.documentElement.scrollTop || 0;
        btn.classList.toggle('show', top > 300);
      }
      window.addEventListener('scroll', onScroll, true);
      btn.addEventListener('click', function () {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        var c = document.querySelector('.content');
        if (c) c.scrollTo({ top: 0, behavior: 'smooth' });
      });
      setInterval(onScroll, 500); // 兜底：覆盖 scroll 事件可能遗漏的切页场景
    })();

    window.$docsify = {
      name: '人工智能训练师培训资料',
      repo: 'junxnone/AIT',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 2,
      auto2top: true,
      coverpage: true,
      onlyCover: false,
      homepage: 'README.md',
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
        '/.*/_navbar.md': '/_navbar.md'
      },
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索课题 / 考点 / 关键词...',
        noData: '没有找到结果',
        depth: 6,
        hideOtherSidebarContent: false,
      },
      copyCode: {
        buttonText: '复制',
        errorText: '出错了',
        successText: '已复制'
      },
      sidebarDisplayLevel: 1,
      pagination: {
        previousText: '上一篇',
        nextText: '下一篇',
        crossChapter: true,
        crossChapterText: true,
      },
      formatUpdated: '{MM}/{DD} {HH}:{mm}',
      plugins: [
        // auto2top 在切换“上一篇/下一篇”时偶发不生效，这里强制每次路由切换后回到顶部
        function (hook) {
          hook.doneEach(function () {
            window.scrollTo(0, 0);
            var c = document.querySelector('.content');
            if (c) c.scrollTop = 0;
          });
        }
      ],
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
</body>
</html>
